# Demo workflow: Kane on the Vercel preview of this repository.
#
# This project does not get GitHub deployment_status events (the Deployments
# API stays empty). repository_dispatch (vercel.deployment.ready) is the
# official Vercel path but has not arrived here either — likely a GitHub App
# permission grant still pending. pull_request is the $0 fallback: wait for
# the Vercel commit status on the PR head SHA, then use the git-branch alias.
# workflow_dispatch remains a manual escape hatch.
# Receipt posts its own PR comment.
name: Receipt

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  deployment_status:
  repository_dispatch:
    types:
      - vercel.deployment.ready
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      preview_url:
        description: Start URL if this is a manual run (otherwise the Vercel event URL is used)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write
  statuses: read

concurrency:
  group: receipt-${{ github.event.pull_request.number || github.event.client_payload.git.ref || github.event.deployment.environment || github.event.deployment.sha || github.sha }}
  cancel-in-progress: true

jobs:
  receipt:
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment != 'Production') ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'vercel.deployment.ready') ||
      (github.event_name == 'repository_dispatch' &&
       github.event.action == 'vercel.deployment.success' &&
       github.event.client_payload.environment != 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the deployment SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.event.pull_request.head.sha || github.event.deployment.sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RECEIPT_GIT_TOKEN || github.token }}

      - name: Receipt
        uses: ./
        with:
          test-file: tests/receipt_checkout_test.md
          production-url: ${{ vars.RECEIPT_PRODUCTION_URL }}
          allowlist: shop/**
          max-fixes: "3"
          username: ${{ secrets.LT_USERNAME }}
          access-key: ${{ secrets.LT_ACCESS_KEY }}
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
          git-token: ${{ secrets.RECEIPT_GIT_TOKEN }}
        env:
          RECEIPT_GIT_NAME: ohjay-official
          RECEIPT_GIT_EMAIL: ohjay-official@users.noreply.github.com
          RECEIPT_PREVIEW_URL: ${{ github.event.inputs.preview_url || github.event.client_payload.url || '' }}
          RECEIPT_PREVIEW_SHA: ${{ github.event.client_payload.git.sha || github.event.pull_request.head.sha || github.event.deployment.sha || github.sha }}
          RECEIPT_VERCEL_PROJECT: receipt
          RECEIPT_VERCEL_SCOPE: oh-jay-s-projects
          RECEIPT_WAIT_FOR_VERCEL_STATUS: ${{ github.event_name == 'pull_request' && 'true' || 'false' }}
          RECEIPT_DEMO_CHEAT: ${{ (github.head_ref == 'demo/cheat-refusal' || github.event.pull_request.head.ref == 'demo/cheat-refusal') && '1' || '0' }}
