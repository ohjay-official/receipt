name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  action-tests:
    name: Action unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test

  shop-build:
    name: Shop build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: shop/package-lock.json
      - run: npm ci
      - run: npm run build

  shop-price:
    name: Shop price contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: shop/package-lock.json
      - run: npm ci
      - run: npm test
